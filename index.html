<!DOCTYPE html>
<html lang="uz" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHSB_PRO — 9-sinf fanlaridan interaktiv test va reyting platformasi</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'] }
    }
  }
};
</script>
<style>
  :root {
    --bg: #0b0f19;
    --card: #13192b;
    --card2: #1c243d;
    --tx: #f1f5f9;
    --mu: #94a3b8;
    --bd: #26314f;
  }
  html.light {
    --bg: #f1f5f9;
    --card: #ffffff;
    --card2: #f8fafc;
    --tx: #0f172a;
    --mu: #64748b;
    --bd: #e2e8f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background-color: var(--bg);
    color: var(--tx);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    transition: background-color 0.2s, color 0.2s;
  }
  .surface-card {
    background-color: var(--card);
    border: 1px solid var(--bd);
  }
  .surface-card2 {
    background-color: var(--card2);
    border: 1px solid var(--bd);
  }
  .text-muted { color: var(--mu); }
  .border-subtle { border-color: var(--bd); }
  .q-image-box {
    background: #ffffff;
    border-radius: 14px;
    padding: 12px;
    border: 1px solid #cbd5e1;
    overflow-x: auto;
  }
  .q-image-box img {
    display: block;
    width: 100%;
    max-width: 860px;
    height: auto;
    margin: 0 auto;
    cursor: zoom-in;
  }
  .score-ring {
    width: 148px;
    height: 148px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: conic-gradient(var(--ring-color, #3b82f6) calc(var(--pct, 0) * 1%), var(--card2) 0);
    flex-shrink: 0;
  }
  .score-ring-inner {
    width: 118px;
    height: 118px;
    border-radius: 50%;
    background: var(--card);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .tabular-nums { font-variant-numeric: tabular-nums; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .animate-fade { animation: fadeIn 0.2s ease-out; }
</style>
</head>
<body class="antialiased selection:bg-indigo-500 selection:text-white">

<!-- Sticky Header -->
<header class="sticky top-0 z-30 backdrop-blur-md bg-opacity-90 surface-card border-t-0 border-x-0 px-4 sm:px-6 py-3">
  <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-3">
    <div class="flex items-center gap-3">
      <button type="button" id="brandHomeBtn" class="flex items-center gap-2 text-left group focus:outline-none">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-blue-600 flex items-center justify-center text-white font-extrabold text-lg shadow-md shadow-indigo-500/20 group-hover:scale-105 transition">
          9
        </div>
        <div>
          <div class="font-extrabold text-lg tracking-tight leading-none">
            CHSB<span class="text-indigo-500">_PRO</span>
          </div>
          <div class="text-xs text-muted font-medium mt-0.5">9-sinf test va reyting tizimi</div>
        </div>
      </button>
    </div>

    <nav class="flex items-center gap-2 sm:gap-3 flex-wrap">
      <button type="button" id="navHomeBtn" class="px-3 py-1.5 rounded-lg text-sm font-semibold surface-card2 hover:border-indigo-500 transition">
        🏠 Bosh sahifa
      </button>
      <button type="button" id="navJsonBtn" class="px-3 py-1.5 rounded-lg text-sm font-semibold surface-card2 hover:border-indigo-500 transition">
        💾 JSON Baza
      </button>
      <button type="button" id="themeToggleBtn" class="p-2 rounded-lg surface-card2 hover:border-indigo-500 transition text-sm" title="Mavzuni o'zgartirish">
        🌓
      </button>
      <div id="userHeaderBox" class="flex items-center gap-2"></div>
    </nav>
  </div>
</header>

<!-- Main Content Container -->
<main id="app" class="max-w-6xl mx-auto px-4 sm:px-6 py-6 pb-20"></main>

<!-- Hidden File Input for JSON Import -->
<input type="file" id="jsonFileInput" accept=".json,application/json" class="hidden">

<!-- Toast Notification Container -->
<div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none px-4 sm:px-0"></div>

<!-- Universal Modal Container -->
<div id="modalRoot" class="fixed inset-0 z-40 hidden items-center justify-center bg-black/70 backdrop-blur-sm p-4"></div>

<script id="embeddedImagesJson" type="application/json">null</script>
<!-- Image Zoom Modal -->
<div id="zoomModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/85 p-4 cursor-zoom-out">
  <div class="relative max-w-5xl w-full bg-white rounded-2xl p-4 shadow-2xl overflow-auto max-h-[92vh]">
    <button type="button" id="closeZoomBtn" class=" sticky top-2 float-right bg-slate-900 text-white rounded-full w-9 h-9 font-bold text-lg flex items-center justify-center shadow-lg">✕</button>
    <img id="zoomImg" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Kattalashtirilgan savol rasmi" class="w-full h-auto block mx-auto">
  </div>
</div>

function safeGetStorage(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) {
    return fallback;
  }
}

function safeSetStorage(key, val) {
  try {
    localStorage.setItem(key, JSON.stringify(val));
  } catch (e) {}
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function fmtScore(x) {
  const num = Number(x) || 0;
  return (Math.round(num * 10) / 10).toString().replace('.', ',');
}

function mmss(seconds) {
  const s = Math.max(0, Math.floor(Number(seconds) || 0));
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}

// Fetch results from both localStorage and optional Python server.py
async function loadSubjectResults(subj) {
  let serverList = [];
  if (location.protocol.startsWith('http')) {
    try {
      const apiPath = ['/api/results', subj].join('/');
      const resp = await fetch(apiPath, { cache: 'no-store' });
      if (resp.ok) {
        const parsed = await resp.json();
        if (Array.isArray(parsed)) serverList = parsed;
      }
    } catch (e) {}
  }
  const localV2 = safeGetStorage(`chsb_results_${subj}`, []);
  const localV1 = safeGetStorage(`local_${subj}`, []);
  const combined = [...serverList, ...localV2, ...localV1];

  // Deduplicate identical attempts by name + variant + score + time + date
  const seen = new Set();
  const deduped = [];
  for (const r of combined) {
    if (!r || !r.name) continue;
    const sig = `${r.name.trim().toLowerCase()}|${r.variant}|${r.score}|${r.time}|${r.date || ''}`;
    if (!seen.has(sig)) {
      seen.add(sig);
      deduped.push({
        name: String(r.name).trim(),
        subject: subj,
        variant: String(r.variant || '1'),
        score: Number(r.score) || 0,
        total: Number(r.total) || 1,
        correct: Number(r.correct) || 0,
        wrong: Number(r.wrong) || 0,
        skipped: Number(r.skipped) || 0,
        time: Number(r.time) || 0,
        date: r.date || new Date().toISOString().slice(0, 19).replace('T', ' ')
      });
    }
  }
  safeSetStorage(`chsb_results_${subj}`, deduped);
  resultsCache[subj] = deduped;
  return deduped;
}

async function loadAllResults() {
  await Promise.all(Object.keys(SUBJECTS).map(s => loadSubjectResults(s)));
}

async function saveTestResult(rec) {
  const subj = rec.subject;
  const fullRec = {
    ...rec,
    date: new Date().toISOString().slice(0, 19).replace('T', ' ')
  };
  const existing = await loadSubjectResults(subj);
  existing.push(fullRec);
  safeSetStorage(`chsb_results_${subj}`, existing);
  safeSetStorage(`local_${subj}`, existing);
  resultsCache[subj] = existing;

  let savedToServer = false;
  if (location.protocol.startsWith('http')) {
    try {
      const apiPath = ['/api', 'result'].join('/');
      const resp = await fetch(apiPath, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(fullRec)
      });
      if (resp.ok) savedToServer = true;
    } catch (e) {}
  }

  if (autoDownloadJson) {
    exportSubjectJson(subj, true);
  }
  return savedToServer ? 'server' : 'local';
}

// Compute leaderboard (best score per student, tie-breaker: faster time)
function computeLeaderboard(records, variantFilter = '', searchQuery = '') {
  const bestByStudent = {};
  const q = searchQuery.trim().toLowerCase();
  for (const r of records) {
    if (!r || !r.name) continue;
    if (variantFilter && String(r.variant) !== String(variantFilter)) continue;
    if (q && !r.name.toLowerCase().includes(q)) continue;
    const key = r.name.trim().toLowerCase();
    const cur = bestByStudent[key];
    if (
      !cur ||
      r.score > cur.score ||
      (r.score === cur.score && r.time < cur.time)
    ) {
      bestByStudent[key] = r;
    }
  }
  return Object.values(bestByStudent).sort((a, b) => (b.score - a.score) || (a.time - b.time));
}

// Export JSON file for a subject (or all subjects)
function exportSubjectJson(subj, silent = false) {
  const data = resultsCache[subj] || safeGetStorage(`chsb_results_${subj}`, []);
  const jsonStr = JSON.stringify(data, null, 2);
  const blob = new Blob([jsonStr], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${subj}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  if (!silent) {
    showToast(`${SUBJECTS[subj].name} natijalari (${data.length} ta yozuv) ${subj}.json fayliga saqlandi!`, 'ok');
  }
}

function exportAllJson() {
  const allData = {
    exportedAt: new Date().toISOString(),
    fizika: resultsCache.fizika || [],
    matematika: resultsCache.matematika || [],
    ingliz: resultsCache.ingliz || []
  };
  const blob = new Blob([JSON.stringify(allData, null, 2)], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'chsb_barcha_natijalar.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast('Barcha fanlar natijalari chsb_barcha_natijalar.json fayliga yuklab olindi!', 'ok');
}

    if (currentUser && currentUser.name && !force) {
      resolve(currentUser);
      return;
    }
    const modal = document.getElementById('modalRoot');
    const parts = (currentUser && currentUser.name ? currentUser.name.trim() : '').split(/\s+/);
    const firstName = parts[0] || '';
    const lastName = parts.slice(1).join(' ') || '';

    modal.classList.remove('hidden');
    modal.classList.add('flex');
    modal.innerHTML = `
      <div class="surface-card rounded-2xl max-w-md w-full p-6 shadow-2xl animate-fade">
        <div class="flex items-center justify-between mb-2">
          <h2 class="text-xl font-extrabold">👋 Xush kelibsiz!</h2>
          ${currentUser && currentUser.name ? `<button type="button" id="closeNameModalBtn" class="text-muted hover:text-white text-lg font-bold">✕</button>` : ''}
        </div>
        <p class="text-sm text-muted mb-4">
          Test natijalaringiz JSON faylga va fanlar reytingiga yozilishi uchun ism va familiyangizni kiriting.
        </p>
        <div id="nameModalErr" class="hidden mb-3 rounded-xl bg-rose-500/15 border border-rose-500/40 text-rose-300 px-3 py-2 text-xs font-medium">
          Iltimos, ism va familiyangizni to'liq kiriting!
        </div>
        <div class="space-y-3">
          <div>
            <label for="firstNameInput" class="block text-xs font-semibold uppercase tracking-wider text-muted mb-1">Ism</label>
            <input id="firstNameInput" type="text" maxlength="30" placeholder="Masalan: Sardor" value="${esc(firstName)}"
              class="w-full px-3.5 py-2.5 rounded-xl surface-card2 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-medium">
          </div>
          <div>
            <label for="lastNameInput" class="block text-xs font-semibold uppercase tracking-wider text-muted mb-1">Familiya</label>
            <input id="lastNameInput" type="text" maxlength="35" placeholder="Masalan: Karimov" value="${esc(lastName)}"
              class="w-full px-3.5 py-2.5 rounded-xl surface-card2 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-medium">
          </div>
          <button type="button" id="saveNameBtn" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm shadow-lg shadow-indigo-600/25 transition mt-2">
            Saqlash va davom etish →
          </button>
        </div>
      </div>
    `;

    const fnEl = document.getElementById('firstNameInput');
    const lnEl = document.getElementById('lastNameInput');
    const errEl = document.getElementById('nameModalErr');
    const saveBtn = document.getElementById('saveNameBtn');
    const closeBtn = document.getElementById('closeNameModalBtn');

    const submit = () => {
      const f = fnEl.value.trim();
      const l = lnEl.value.trim();
      if (!f || !l) {
        errEl.classList.remove('hidden');
        (!f ? fnEl : lnEl).focus();
        return;
      }
      currentUser = { name: `${f} ${l}`, firstName: f, lastName: l };
      safeSetStorage('chsb_user_v2', currentUser);
      safeSetStorage('chsb_user', currentUser);
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      modal.innerHTML = '';
      renderHeaderUser();
      showToast(`Foydalanuvchi: ${currentUser.name}`, 'ok');
      resolve(currentUser);
    };

    saveBtn.addEventListener('click', submit);
    if (closeBtn) {
      closeBtn.addEventListener('click', () => {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        modal.innerHTML = '';
        resolve(currentUser);
      });
    }
    modal.onkeydown = e => {
      if (e.key === 'Enter') submit();
    };
    setTimeout(() => fnEl.focus(), 40);
  });
}

function openConfirmModal({ title, message, confirmText = 'Tasdiqlash', cancelText = 'Bekor qilish', danger = false }) {
  return new Promise(resolve => {
    const modal = document.getElementById('modalRoot');
    modal.classList.remove('hidden');
    modal.classList.add('flex');
    modal.innerHTML = `
      <div class="surface-card rounded-2xl max-w-md w-full p-6 shadow-2xl animate-fade">
        <h3 class="text-lg font-extrabold mb-2">${esc(title)}</h3>
        <p class="text-sm text-muted mb-5">${esc(message)}</p>
        <div class="flex items-center justify-end gap-3">
          <button type="button" id="confirmCancelBtn" class="px-4 py-2.5 rounded-xl surface-card2 font-semibold text-sm hover:border-slate-400 transition">
            ${esc(cancelText)}
          </button>
          <button type="button" id="confirmOkBtn" class="px-5 py-2.5 rounded-xl font-bold text-sm text-white transition ${danger ? 'bg-rose-600 hover:bg-rose-500' : 'bg-emerald-600 hover:bg-emerald-500'}">
            ${esc(confirmText)}
          </button>
        </div>
      </div>
    `;
    const close = val => {
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      modal.innerHTML = '';
      resolve(val);
    };
    document.getElementById('confirmCancelBtn').addEventListener('click', () => close(false));
    document.getElementById('confirmOkBtn').addEventListener('click', () => close(true));
  });
}

// 4. ROUTER & VIEWS (Home, Subject Variants, Test Runner, Results, Rating)
// ============================================================================
function navigate(hashPath) {
  location.hash = '#/' + hashPath;
}

async function handleRoute() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
  await loadAllResults();

  const rawHash = location.hash.replace(/^#\/?/, '');
  const parts = rawHash.split('/').filter(Boolean);

  if (parts.length === 0) {
    renderHomeView();
  } else if (parts[0] === 's' && SUBJECTS[parts[1]]) {
    renderSubjectView(parts[1]);
  } else if (parts[0] === 't' && SUBJECTS[parts[1]] && parts[2]) {
    await startTestSession(parts[1], parts[2]);
  } else if (parts[0] === 'r' && SUBJECTS[parts[1]]) {
    renderRatingView(parts[1]);
  } else {
    renderHomeView();
  }
}

              <span class="px-2.5 py-1 rounded-full text-xs font-bold ${pct >= 75 ? 'bg-emerald-500/20 text-emerald-400' : pct >= 50 ? 'bg-amber-500/20 text-amber-400' : 'bg-rose-500/20 text-rose-400'}">
                ${pct}%

async function startTestSession(subjId, varId) {
  await openNameModal(false);
  const subj = SUBJECTS[subjId];
  const variantObj = getSubjectData(subjId).find(v => String(v.id) === String(varId));
  if (!variantObj) {
    navigate(`s/${subjId}`);
    return;
  }

  activeTest = {
    subjId,
    varId: variantObj.id,
    variant: variantObj,
    answers: {},
    currentIndex: 0,
    secondsLeft: subj.minutes * 60,
    startedAt: Date.now(),
    finished: false,
    reviewFilter: 'all',
    expandAll: true
  };

  renderQuestionScreen();

  timerInterval = setInterval(() => {
    if (!activeTest || activeTest.finished) return;
    const elapsed = Math.floor((Date.now() - activeTest.startedAt) / 1000);
    activeTest.secondsLeft = Math.max(0, subj.minutes * 60 - elapsed);
    const timerEl = document.getElementById('liveTimerText');
    if (timerEl) {
      timerEl.textContent = mmss(activeTest.secondsLeft);
      if (activeTest.secondsLeft < 300) {
        timerEl.classList.add('text-rose-500');
      }
    }
    if (activeTest.secondsLeft <= 0) {
      finishActiveTest(false);
    }
  }, 500);
}

async function finishActiveTest(askConfirmation = true) {
  if (!activeTest || activeTest.finished) return;
  const { subjId, varId, variant, answers } = activeTest;
  const unanswered = variant.questions.length - Object.keys(answers).length;

  if (askConfirmation) {
    const ok = await openConfirmModal({
      title: 'Testni yakunlaysizmi?',
      message: unanswered > 0
        ? `Sizda hali ${unanswered} ta savol belgilangan emas. Shunga qaramay testni yakunlab natijani ko'rasizmi?`
        : 'Barcha savollarga javob belgiladingiz. Testni yakunlab natija va tahlilni ko\'rasizmi?',
      confirmText: 'Ha, yakunlash ✓',
      cancelText: 'Tekshirib olish'
    });
    if (!ok) return;
  }

  activeTest.finished = true;
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }

  const subj = SUBJECTS[subjId];
  const timeSpent = Math.min(
    Math.max(1, Math.floor((Date.now() - activeTest.startedAt) / 1000)),
    subj.minutes * 60
  );

  let score = 0;
  let correct = 0;
  let wrong = 0;
  let skipped = 0;

  for (const q of variant.questions) {
    const userAns = answers[q.n];
    if (!userAns) {
      skipped++;
    } else if (userAns === q.ans) {
      correct++;
      score += q.pts;
    } else {
      wrong++;
    }
  }

  const totalPts = variant.questions.reduce((a, q) => a + q.pts, 0);
  const saveWhere = await saveTestResult({
    name: currentUser ? currentUser.name : 'Mehmon O\'quvchi',
    subject: subjId,
    variant: varId,
    score: Math.round(score * 100) / 100,
    total: totalPts,
    correct,
    wrong,
    skipped,
    time: timeSpent
  });

  activeTest.summary = {
    score,
    totalPts,
    correct,
    wrong,
    skipped,
    timeSpent,
    saveWhere
  };

  showToast(`Natija saqlandi: ${fmtScore(score)} / ${fmtScore(totalPts)} ball!`, 'ok');
  renderTestResultScreen();
}

            🗂️ Boshqa variant tanlash
          </button>
          <button type="button" id="goHomeFromResBtn" class="px-5 py-2.5 rounded-xl surface-card2 hover:border-indigo-400 font-semibold text-sm transition">
            🏠 Bosh sahifa reytingi
          </button>
        </div>
      </div>

      <!-- Quick Overview Matrix of All Questions -->
      <div class="surface-card rounded-2xl p-5">
        <div class="text-xs font-bold uppercase tracking-wider text-muted mb-3">
          Savollar bo'yicha qisqacha xarita (savol raqamini bossangiz tahlilga o'tadi):
        </div>
        <div class="flex flex-wrap gap-2">
          ${variant.questions.map(q => {
            const a = answers[q.n];
            const st = !a ? 'skip' : a === q.ans ? 'ok' : 'bad';
            const cls = st === 'ok'
              ? 'bg-emerald-600 text-white'
              : st === 'bad'
              ? 'bg-rose-600 text-white'
              : 'surface-card2 text-muted';
            return `
              <button type="button" data-scroll-q="${q.n}" class="px-3 py-2 rounded-xl text-xs font-extrabold transition hover:scale-105 ${cls}">
                <div>#${q.n}</div>
                <div class="text-[10px] opacity-90">${a || '—'} ${st === 'bad' ? '→ ' + q.ans : ''}</div>
              </button>
            `;
          }).join('')}
        </div>
      </div>

      <!-- Detailed Question-by-Question Review Header & Filters -->
      <div class="space-y-4">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <h2 class="text-xl font-extrabold">🔍 Har bir savol tahlili va yechimi</h2>
          <div class="flex flex-wrap items-center gap-2">
            <button type="button" data-rf="all" class="px-3 py-1.5 rounded-xl text-xs font-bold transition ${reviewFilter === 'all' ? 'bg-indigo-600 text-white' : 'surface-card2'}">
              Barchasi (${variant.questions.length})
            </button>
            <button type="button" data-rf="bad" class="px-3 py-1.5 rounded-xl text-xs font-bold transition ${reviewFilter === 'bad' ? 'bg-rose-600 text-white' : 'surface-card2'}">
              ✗ Xatolar (${wrong})
            </button>
            <button type="button" data-rf="ok" class="px-3 py-1.5 rounded-xl text-xs font-bold transition ${reviewFilter === 'ok' ? 'bg-emerald-600 text-white' : 'surface-card2'}">
              ✓ To'g'rilar (${correct})
            </button>
            <button type="button" data-rf="skip" class="px-3 py-1.5 rounded-xl text-xs font-bold transition ${reviewFilter === 'skip' ? 'bg-amber-600 text-white' : 'surface-card2'}">
              — Belgilanmagan (${skipped})
            </button>
            <button type="button" id="toggleExpandAllBtn" class="px-3 py-1.5 rounded-xl surface-card2 hover:border-indigo-400 text-xs font-semibold transition">
              ${expandAll ? '▲ Barchasini yig\'ish' : '▼ Barchasini ochish'}
            </button>
          </div>
        </div>

        <!-- Review Cards List -->
        <div class="space-y-4" id="reviewListContainer">
          ${filteredQuestions.length ? filteredQuestions.map(q => {
            const a = answers[q.n];
            const st = !a ? 'skip' : a === q.ans ? 'ok' : 'bad';
            const borderCls = st === 'ok' ? 'border-l-4 border-l-emerald-500' : st === 'bad' ? 'border-l-4 border-l-rose-500' : 'border-l-4 border-l-amber-500';
            const badgeHtml = st === 'ok'
              ? '<span class="px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-400 text-xs font-extrabold">✓ To\'g\'ri</span>'
              : st === 'bad'
              ? '<span class="px-2.5 py-1 rounded-full bg-rose-500/20 text-rose-400 text-xs font-extrabold">✗ Xato</span>'
              : '<span class="px-2.5 py-1 rounded-full bg-amber-500/20 text-amber-400 text-xs font-extrabold">— Belgilanmagan</span>';

            return `
              <div id="reviewCard_${q.n}" class="surface-card rounded-2xl overflow-hidden ${borderCls}">
                <button type="button" data-toggle-review="${q.n}" class="w-full p-4 flex flex-wrap items-center justify-between gap-3 text-left hover:bg-white/5 transition">
                  <div class="flex flex-wrap items-center gap-3">
                    <span class="font-extrabold text-base">#${q.n}-savol</span>
                    ${badgeHtml}
                    <span class="text-xs sm:text-sm">
                      Sizning javobingiz: <b class="${st === 'ok' ? 'text-emerald-400' : 'text-rose-400'}">${a || 'Belgilanmagan'}</b>
                      · To'g'ri javob: <b class="text-emerald-400">${q.ans}</b>
                    </span>
                  </div>
                  <div class="flex items-center gap-3">
                    <span class="text-xs font-bold ${st === 'ok' ? 'text-emerald-400' : 'text-muted'}">
                      ${st === 'ok' ? '+' + fmtScore(q.pts) : '0'} / ${fmtScore(q.pts)} ball
                    </span>
                    <span class="text-xs text-muted">▾</span>
                  </div>
                </button>

                <div id="reviewBody_${q.n}" class="${expandAll ? 'block' : 'hidden'} p-4 pt-0 border-t border-subtle space-y-4">
                  <div class="pt-3">
                    <div class="text-xs font-bold uppercase tracking-wider text-muted mb-2">📝 Savol sharti:</div>
                    <div class="q-image-box space-y-2">
                      ${q.img.map(f => `<img src="${getImgSrc(subjId, f)}" alt="${q.n}-savol" loading="lazy" data-zoom-src="${getImgSrc(subjId, f)}">`).join('')}
                    </div>
                  </div>
                  <div>
                    <div class="text-xs font-bold uppercase tracking-wider text-emerald-400 mb-2">💡 To'g'ri yechim va izoh (Javob: ${q.ans}):</div>
                    <div class="q-image-box space-y-2">
                      ${q.exp.map(f => `<img src="${getImgSrc(subjId, f)}" alt="${q.n}-yechim" loading="lazy" data-zoom-src="${getImgSrc(subjId, f)}">`).join('')}
                    </div>
                  </div>
                </div>
              </div>
            `;
          }).join('') : `
            <div class="surface-card rounded-2xl p-8 text-center text-muted text-sm">
              Ushbu filtr bo'yicha savollar topilmadi.
            </div>
          `}
        </div>
      </div>
    </div>
  `;

  // Wire Result Screen Controls
  document.getElementById('resBackSubjBtn').addEventListener('click', () => navigate(`s/${subjId}`));
  document.getElementById('resDownloadJsonBtn').addEventListener('click', () => exportSubjectJson(subjId));
  document.getElementById('resOpenRatingBtn').addEventListener('click', () => navigate(`r/${subjId}`));
  document.getElementById('retryVariantBtn').addEventListener('click', () => startTestSession(subjId, varId));
  document.getElementById('otherVariantBtn').addEventListener('click', () => navigate(`s/${subjId}`));
  document.getElementById('goHomeFromResBtn').addEventListener('click', () => {
    homeLeaderboardSubject = subjId;
    navigate('');
  });

  document.querySelectorAll('[data-rf]').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTest.reviewFilter = btn.getAttribute('data-rf');
      renderTestResultScreen();
    });
  });

  document.getElementById('toggleExpandAllBtn').addEventListener('click', () => {
    activeTest.expandAll = !activeTest.expandAll;
    renderTestResultScreen();
  });

  document.querySelectorAll('[data-toggle-review]').forEach(btn => {
    btn.addEventListener('click', () => {
      const qn = btn.getAttribute('data-toggle-review');
      const bodyEl = document.getElementById(`reviewBody_${qn}`);
      if (bodyEl) bodyEl.classList.toggle('hidden');
    });
  });

  document.querySelectorAll('[data-scroll-q]').forEach(btn => {
    btn.addEventListener('click', () => {
      const qn = btn.getAttribute('data-scroll-q');
      if (activeTest.reviewFilter !== 'all') {
        activeTest.reviewFilter = 'all';
        renderTestResultScreen();
      }
      const cardEl = document.getElementById(`reviewCard_${qn}`);
      const bodyEl = document.getElementById(`reviewBody_${qn}`);
      if (bodyEl) bodyEl.classList.remove('hidden');
      if (cardEl) cardEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  });

  document.querySelectorAll('[data-zoom-src]').forEach(img => {
    img.addEventListener('click', () => openZoomModal(img.getAttribute('data-zoom-src')));
  });
}

// ----------------------------------------------------------------------------
// VIEW 5: DEDICATED SUBJECT RATING PAGE
// ----------------------------------------------------------------------------
function renderRatingView(subjId) {
  const subj = SUBJECTS[subjId];
  const variants = getSubjectData(subjId);
  const rs = resultsCache[subjId] || [];
  let selectedVar = '';
  let searchQuery = '';

  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="animate-fade space-y-6">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div>
          <button type="button" id="ratingBackHomeBtn" class="text-xs font-bold text-indigo-400 hover:underline mb-1">
            ← Bosh sahifaga qaytish
          </button>
          <h1 class="text-2xl sm:text-3xl font-extrabold flex items-center gap-2">
            <span>🏆 ${subj.icon} ${subj.name} — Top Reyting</span>
          </h1>
          <p class="text-sm text-muted mt-0.5">
            Jami saqlangan urinishlar: <b>${rs.length} ta</b>. Reytingda har bir o'quvchining eng yaxshi natijasi ko'rinadi.
          </p>
        </div>
        <div class="flex flex-wrap items-center gap-2">
          <button type="button" id="ratingExportBtn" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs sm:text-sm font-bold transition">
            📥 ${subjId}.json yuklab olish
          </button>
          <button type="button" id="ratingImportBtn" class="px-4 py-2 rounded-xl surface-card2 hover:border-indigo-400 text-xs sm:text-sm font-semibold transition">
            📤 JSON yuklash
          </button>
          <button type="button" id="ratingOpenTestsBtn" class="px-4 py-2 rounded-xl surface-card2 hover:border-indigo-400 text-xs sm:text-sm font-semibold transition">
            📝 Variantlarni yechish
          </button>
        </div>
      </div>

      <div class="surface-card rounded-3xl p-5 sm:p-6 space-y-4">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div class="flex flex-wrap items-center gap-2">
            <select id="ratingVarSelect" class="surface-card2 rounded-xl px-3.5 py-2 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="">Barcha variantlar</option>
              ${variants.map(v => `<option value="${v.id}">${variantTitle(v.id)}</option>`).join('')}
            </select>
            <input id="ratingSearchInput" type="text" placeholder="Ism yoki familiya bo'yicha qidirish..."
              class="surface-card2 rounded-xl px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 w-64 max-w-full">
          </div>
          <div class="flex flex-wrap gap-2">
            ${Object.values(SUBJECTS).map(s => `
              <button type="button" data-switch-rating="${s.id}"
                class="px-3 py-1.5 rounded-xl text-xs font-bold transition ${s.id === subjId ? 'bg-indigo-600 text-white' : 'surface-card2 hover:border-indigo-400'}">
                ${s.icon} ${s.name}
              </button>
            `).join('')}
          </div>
        </div>

        <div class="overflow-x-auto rounded-2xl border border-subtle">
          <table class="w-full text-left border-collapse text-sm">
            <thead>
              <tr class="surface-card2 text-muted text-xs uppercase">
                <th class="py-3 px-4 font-bold">#</th>
                <th class="py-3 px-4 font-bold">Ism va Familiya</th>
                <th class="py-3 px-4 font-bold">Ball</th>
                <th class="py-3 px-4 font-bold">Foiz</th>
                <th class="py-3 px-4 font-bold">To'g'ri / Xato / Bo'sh</th>
                <th class="py-3 px-4 font-bold">Variant</th>
                <th class="py-3 px-4 font-bold">Vaqt</th>
                <th class="py-3 px-4 font-bold">Sana</th>
              </tr>
            </thead>
            <tbody id="ratingTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  `;

  const drawTable = () => {
    const board = computeLeaderboard(resultsCache[subjId] || [], selectedVar, searchQuery).slice(0, 100);
    const tbody = document.getElementById('ratingTableBody');
    if (!tbody) return;
    if (!board.length) {
      tbody.innerHTML = `
        <tr>
          <td colspan="8" class="py-10 px-4 text-center text-muted">
            Hozircha natijalar topilmadi.
          </td>
        </tr>
      `;
      return;
    }
    tbody.innerHTML = board.map((r, i) => {
      const isMe = currentUser && r.name.toLowerCase() === currentUser.name.toLowerCase();
      const pct = Math.round((r.score / r.total) * 100);
      return `
        <tr class="border-t border-subtle ${isMe ? 'bg-indigo-500/10 font-semibold' : ''}">
          <td class="py-3 px-4 font-bold">${['🥇 1', '🥈 2', '🥉 3'][i] || (i + 1)}</td>
          <td class="py-3 px-4 font-bold">${esc(r.name)} ${isMe ? '<span class="text-xs text-indigo-400">(Siz)</span>' : ''}</td>
          <td class="py-3 px-4 font-extrabold text-indigo-400">${fmtScore(r.score)} / ${fmtScore(r.total)}</td>
          <td class="py-3 px-4">
            <span class="px-2.5 py-1 rounded-full text-xs font-bold ${pct >= 75 ? 'bg-emerald-500/20 text-emerald-400' : pct >= 50 ? 'bg-amber-500/20 text-amber-400' : 'bg-rose-500/20 text-rose-400'}">
              ${pct}%
            </span>
          </td>
          <td class="py-3 px-4 text-xs">
            <span class="text-emerald-400 font-bold">✓ ${r.correct}</span> ·
            <span class="text-rose-400 font-bold">✗ ${r.wrong}</span> ·
            <span class="text-muted">— ${r.skipped || 0}</span>
          </td>
          <td class="py-3 px-4 text-xs font-semibold">${variantTitle(r.variant)}</td>
          <td class="py-3 px-4 tabular-nums text-xs">${mmss(r.time)}</td>
          <td class="py-3 px-4 text-xs text-muted">${esc((r.date || '').slice(0, 16))}</td>
        </tr>
      `;
    }).join('');
  };

  document.getElementById('ratingBackHomeBtn').addEventListener('click', () => navigate(''));
  document.getElementById('ratingExportBtn').addEventListener('click', () => exportSubjectJson(subjId));
  document.getElementById('ratingImportBtn').addEventListener('click', () => triggerImportJson(subjId));
  document.getElementById('ratingOpenTestsBtn').addEventListener('click', () => navigate(`s/${subjId}`));
  document.getElementById('ratingVarSelect').addEventListener('change', e => {
    selectedVar = e.target.value;
    drawTable();
  });
  document.getElementById('ratingSearchInput').addEventListener('input', e => {
    searchQuery = e.target.value;
    drawTable();
  });
  document.querySelectorAll('[data-switch-rating]').forEach(btn => {
    btn.addEventListener('click', () => navigate(`r/${btn.getAttribute('data-switch-rating')}`));
  });

  drawTable();
}

// ============================================================================
// 5. GLOBAL EVENT LISTENERS (Header, Keyboard Navigation, JSON Import, Zoom)
// ============================================================================
document.getElementById('brandHomeBtn').addEventListener('click', () => navigate(''));
document.getElementById('navHomeBtn').addEventListener('click', () => navigate(''));
document.getElementById('navJsonBtn').addEventListener('click', openJsonManagerModal);

document.getElementById('themeToggleBtn').addEventListener('click', () => {
  const htmlEl = document.documentElement;
  if (htmlEl.classList.contains('light')) {
    htmlEl.classList.remove('light');
    htmlEl.classList.add('dark');
    safeSetStorage('chsb_theme', 'dark');
  } else {
    htmlEl.classList.remove('dark');
    htmlEl.classList.add('light');
    safeSetStorage('chsb_theme', 'light');
  }
});

// Restore saved theme
if (safeGetStorage('chsb_theme', 'dark') === 'light') {
  document.documentElement.classList.remove('dark');
  document.documentElement.classList.add('light');
}

// Zoom modal close
document.getElementById('zoomModal').addEventListener('click', () => {
  const zm = document.getElementById('zoomModal');
  zm.classList.add('hidden');
  zm.classList.remove('flex');
});
document.getElementById('closeZoomBtn').addEventListener('click', e => {
  e.stopPropagation();
  const zm = document.getElementById('zoomModal');
  zm.classList.add('hidden');
  zm.classList.remove('flex');
});

// JSON Import Handler
document.getElementById('jsonFileInput').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const parsed = JSON.parse(text);
    let importedCount = 0;

    const mergeSubjectArray = (subj, arr) => {
      if (!SUBJECTS[subj] || !Array.isArray(arr)) return;
      const existing = resultsCache[subj] || safeGetStorage(`chsb_results_${subj}`, []);
      const combined = [...existing, ...arr];
      safeSetStorage(`chsb_results_${subj}`, combined);
      safeSetStorage(`local_${subj}`, combined);
      importedCount += arr.length;
    };

    if (Array.isArray(parsed)) {
      const targetSubj = currentImportSubject || (parsed[0] && parsed[0].subject) || homeLeaderboardSubject || 'fizika';
      mergeSubjectArray(targetSubj, parsed);
    } else if (parsed && typeof parsed === 'object') {
      for (const s of Object.keys(SUBJECTS)) {
        if (Array.isArray(parsed[s])) {
          mergeSubjectArray(s, parsed[s]);
        }
      }
    }

    await loadAllResults();
    showToast(`${importedCount} ta natija JSON fayldan muvaffaqiyatli yuklandi!`, 'ok');
    handleRoute();
  } catch (err) {
    showToast('JSON faylni o\'qishda xatolik yuz berdi. Fayl formatini tekshiring.', 'err');
  }
});

// Keyboard shortcuts during active test
window.addEventListener('keydown', e => {
  const modalOpen = !document.getElementById('modalRoot').classList.contains('hidden');
  const zoomOpen = !document.getElementById('zoomModal').classList.contains('hidden');
  if (zoomOpen && e.key === 'Escape') {
    document.getElementById('zoomModal').click();
    return;
  }
  if (modalOpen || !activeTest || activeTest.finished) return;
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA')) return;

  const key = e.key.toUpperCase();
  const q = activeTest.variant.questions[activeTest.currentIndex];
  if (['A', 'B', 'C', 'D'].includes(key) && key.length === 1) {
    if (activeTest.answers[q.n] === key) delete activeTest.answers[q.n];
    else activeTest.answers[q.n] = key;
    renderQuestionScreen();
  } else if (e.key === 'ArrowRight') {
    if (activeTest.currentIndex < activeTest.variant.questions.length - 1) {
      activeTest.currentIndex++;
      renderQuestionScreen();
    }
  } else if (e.key === 'ArrowLeft') {
    if (activeTest.currentIndex > 0) {
      activeTest.currentIndex--;
      renderQuestionScreen();
    }
  }
});

window.addEventListener('hashchange', handleRoute);

// Initialize App
renderHeaderUser();
openNameModal(false).then(() => handleRoute());
</script>
